<script data-inline-keep>
(function () {
  // 支持 ?theme=light|dark|system 与 #loan / #tax 直达
  var q = null;
  try { q = new URLSearchParams(location.search).get('theme'); } catch (e) {}
  if (q === 'dark' || q === 'light' || q === 'system') {
    try { localStorage.setItem('calc.theme', q); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('calc.theme'); } catch (e) {}
  var useDark = saved === 'dark' ||
    ((saved === 'system' || !saved) && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = useDark ? 'dark' : 'light';
})();

<style data-source="css/tokens.css">
/* ==========================================================================
   tokens.css — 设计令牌与主题（小米计算器风格：浅色 / 深色）
   ========================================================================== */

:root {
  color-scheme: light dark;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* 浅色模式 ---------------------------------------------------------------- */
:root,
html[data-theme="light"] {
  color-scheme: light;

  --bg: #eff1f5;
  --bg-grad: radial-gradient(120% 90% at 50% -20%, #ffffff 0%, #eff1f5 58%, #e6e9ef 100%);
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --surface-3: #eceef3;
  --overlay: #e6e9ef;

  --text: #14161a;
  --text-2: #565b66;
  --text-3: #8d94a1;
  --text-inv: #ffffff;

  --line: rgba(20, 22, 26, 0.09);
  --line-strong: rgba(20, 22, 26, 0.16);

  --accent: #ff6a00;
  --accent-2: #ff8a3d;
  --accent-weak: rgba(255, 106, 0, 0.12);
  --accent-text: #ffffff;

  --cyan: #14a0bd;
  --cyan-weak: rgba(20, 160, 189, 0.14);
  --violet: #7b5cff;
  --violet-weak: rgba(123, 92, 255, 0.14);
  --amber: #e0930c;
  --amber-weak: rgba(224, 147, 12, 0.16);
  --green: #14a55a;
  --green-weak: rgba(20, 165, 90, 0.14);
  --red: #e5484d;
  --red-weak: rgba(229, 72, 77, 0.14);

  /* 水晶数字键 */
  --key-face: #ffffff;
  --key-face-hover: #fbfbfd;
  --key-shadow: 0 1px 1px rgba(20, 22, 26, 0.04), 0 6px 16px -8px rgba(20, 22, 26, 0.22);
  --key-fn-face: #e2e5ec;
  --key-fn-face-hover: #d9dde6;
  --key-shadow-c: 0 1px 1px rgba(20, 22, 26, 0.04), 0 6px 16px -8px rgba(20, 22, 26, 0.26);
  --key-op-shadow: 0 4px 16px -6px rgba(255, 106, 0, 0.6);

  --shadow-sm: 0 1px 2px rgba(20, 22, 26, 0.05);
  --shadow: 0 1px 3px rgba(20, 22, 26, 0.05), 0 12px 28px -16px rgba(20, 22, 26, 0.24);
  --shadow-lg: 0 24px 48px -28px rgba(20, 22, 26, 0.36);

  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  --font-num: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
              "Segoe UI", system-ui, sans-serif;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur: 180ms;
}

/* 深色模式 ---------------------------------------------------------------- */
html[data-theme="dark"] {
  color-scheme: dark;

  --bg: #111318;
  --bg-grad: radial-gradient(120% 90% at 50% -20%, #1e222b 0%, #14161c 55%, #0e1014 100%);
  --surface: #1b1e25;
  --surface-2: #22262e;
  --surface-3: #2b303a;
  --overlay: #2b303a;

  --text: #f2f4f8;
  --text-2: #a3aab8;
  --text-3: #737b8a;
  --text-inv: #14161a;

  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.17);

  --accent: #ff7a1a;
  --accent-2: #ff9647;
  --accent-weak: rgba(255, 122, 26, 0.16);
  --accent-text: #1a0f04;

  --cyan: #35c2dd;
  --cyan-weak: rgba(53, 194, 221, 0.16);
  --violet: #a08cff;
  --violet-weak: rgba(160, 140, 255, 0.18);
  --amber: #f2b23c;
  --amber-weak: rgba(242, 178, 60, 0.18);
  --green: #3ecf82;
  --green-weak: rgba(62, 207, 130, 0.16);
  --red: #ff6b6b;
  --red-weak: rgba(255, 107, 107, 0.16);

  /* 水晶数字键 */
  --key-face: #2c313b;
  --key-face-hover: #333945;
  --key-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 8px 18px -10px rgba(0, 0, 0, 0.8);
  --key-fn-face: #23262e;
  --key-fn-face-hover: #2a2e37;
  --key-shadow-c: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 8px 18px -12px rgba(0, 0, 0, 0.8);
  --key-op-shadow: 0 6px 20px -8px rgba(255, 122, 26, 0.55);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 16px 32px -22px rgba(0, 0, 0, 0.9);
  --shadow-lg: 0 28px 56px -32px rgba(0, 0, 0, 0.95);
}

/* 主题过渡：仅在切换瞬间开启，避免影响页面初始渲染 */
html.theme-anim,
html.theme-anim *,
html.theme-anim *::before,
html.theme-anim *::after {
  transition: background-color 240ms var(--ease), color 240ms var(--ease),
              border-color 240ms var(--ease), box-shadow 240ms var(--ease) !important;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
<style data-source="css/base.css">
/* ==========================================================================
   base.css — 重置、外壳布局、通用控件（头部 / 分段控件 / 表单 / 提示 / 卡片）
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

::selection { background: var(--accent-weak); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* 滚动条 ---------------------------------------------------------------- */
.scroll,
.tablewrap {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.tablewrap::-webkit-scrollbar { width: 10px; height: 10px; }
.tablewrap::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: content-box;
}

/* 外壳 ------------------------------------------------------------------ */
.shell {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 480px;
  min-height: 100%;
  margin: 0 auto;
  padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
}

.appbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 4px;
}

.appbar__brand { display: flex; align-items: center; gap: 10px; }

.appbar__logo {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 12px -4px var(--accent);
}

.appbar__title {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: 0.02em;
}

.appbar__actions { display: flex; align-items: center; gap: 8px; }

/* 主题切换按钮 ---------------------------------------------------------- */
.icon-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.94); }

.icon-btn__sun,
.icon-btn__moon {
  position: absolute;
  width: 18px;
  height: 18px;
  transition: opacity var(--dur) var(--ease), transform 320ms var(--ease);
}

.icon-btn__sun {
  background: var(--amber);
  border-radius: 50%;
  box-shadow: 0 0 0 3px var(--amber-weak);
}
.icon-btn__moon {
  background: var(--text-2);
  border-radius: 50%;
  box-shadow: inset -6px -3px 0 0 var(--surface);
}

.icon-btn--text {
  width: auto;
  height: 38px;
  padding: 0 13px;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 560;
  white-space: nowrap;
}
.icon-btn--text:hover { color: var(--text); }

html[data-theme="light"] .icon-btn__sun { opacity: 1; transform: rotate(0) scale(1); }
html[data-theme="light"] .icon-btn__moon { opacity: 0; transform: rotate(-90deg) scale(0.6); }
html[data-theme="dark"] .icon-btn__sun { opacity: 0; transform: rotate(90deg) scale(0.6); }
html[data-theme="dark"] .icon-btn__moon { opacity: 1; transform: rotate(0) scale(1); }

/* 选项卡 ---------------------------------------------------------------- */
.tabbar {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface-2);
}

.tabbar__btn {
  position: relative;
  z-index: 1;
  padding: 9px 4px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-2);
  font-size: 14.5px;
  font-weight: 560;
  letter-spacing: 0.01em;
  transition: color var(--dur) var(--ease);
  white-space: nowrap;
}
.tabbar__btn.is-active { color: var(--text); }

.tabbar__slider {
  position: absolute;
  top: 4px;
  left: 4px;
  height: calc(100% - 8px);
  /* 宽度 = (总宽 − 内边距 8px − 间隙 4px×(按钮数−1)) ÷ 按钮数，当前为 2 个按钮 */
  width: calc((100% - 8px - 4px) / 2);
  border-radius: var(--radius-pill);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform 260ms var(--ease);
}
.tabbar[data-index="1"] .tabbar__slider { transform: translateX(calc(100% + 4px)); }

/* 已保存参数提示 -------------------------------------------------------- */
.loaded-note {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-weak);
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 560;
  line-height: 1.45;
}
.loaded-note::before {
  content: "";
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* 内容区 ---------------------------------------------------------------- */
.content { flex: 1; }
.pane { display: none; animation: pane-in 260ms var(--ease); }
.pane.is-active { display: block; }

@keyframes pane-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

.stack { display: flex; flex-direction: column; gap: 14px; }

/* 备注 / 卡片 ----------------------------------------------------------- */
.footnote {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 6px;
  color: var(--text-3);
  font-size: 11.5px;
  line-height: 1.6;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.card__title {
  font-size: 15px;
  font-weight: 640;
  letter-spacing: 0.01em;
}

.muted { color: var(--text-3); font-size: 12px; line-height: 1.5; }

/* 分段控件（与 tabbar 同源，用于卡片内切换） --------------------------- */
.seg {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
}

.seg__btn {
  padding: 7px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 560;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease);
  white-space: nowrap;
}
.seg__btn.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.seg--sm .seg__btn { padding: 5px 9px; font-size: 12px; }

/* 表单 ------------------------------------------------------------------ */
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}

.field__label {
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 560;
  letter-spacing: 0.01em;
}

.field__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.grid { display: grid; gap: 12px; }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 400px) { .grid--2 { grid-template-columns: 1fr; } }

.input {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              background-color var(--dur) var(--ease);
}
.input:focus-within {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-weak);
}

.input__el {
  width: 100%;
  min-width: 0;
  padding: 11px 0;
  border: 0;
  background: transparent;
  font-family: var(--font-num);
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  font-weight: 560;
  letter-spacing: 0.01em;
  outline: none;
  appearance: none;
}
.input__el::placeholder { color: var(--text-3); font-weight: 400; }
.input__el[type="month"] { font-size: 15px; }

.input__suffix {
  flex: none;
  color: var(--text-3);
  font-size: 12.5px;
  padding-left: 2px;
}

.select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: 15px;
  font-weight: 560;
  outline: none;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 18px) calc(50% + 2px), calc(100% - 13px) calc(50% + 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }

/* 快捷胶囊 -------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 560;
  font-variant-numeric: tabular-nums;
  transition: all var(--dur) var(--ease);
}
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip.is-active {
  border-color: transparent;
  background: var(--accent-weak);
  color: var(--accent);
}

/* 主按钮 ---------------------------------------------------------------- */
.btn {
  padding: 13px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text);
  font-size: 15px;
  font-weight: 620;
  transition: transform 120ms var(--ease), filter var(--dur) var(--ease),
              background-color var(--dur) var(--ease);
}
.btn:active { transform: scale(0.985); }

.btn--primary {
  border-color: transparent;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  color: var(--accent-text);
  box-shadow: 0 10px 24px -14px var(--accent);
}
.btn--primary:hover { filter: brightness(1.04); }

/* 开关 ------------------------------------------------------------------ */
.switch {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }

.switch__track {
  position: relative;
  flex: none;
  width: 46px;
  height: 27px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  transition: background-color var(--dur) var(--ease);
}
.switch__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform 220ms var(--ease);
}
.switch input:checked + .switch__track { background: var(--accent); }
.switch input:checked + .switch__track::after { transform: translateX(19px); }
.switch input:focus-visible + .switch__track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch__text { font-size: 14px; font-weight: 560; }

/* 折叠面板 -------------------------------------------------------------- */
.details {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  overflow: hidden;
}
.details > summary {
  padding: 12px 14px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 560;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.details > summary::-webkit-details-marker { display: none; }
.details > summary::after {
  content: "";
  width: 7px; height: 7px;
  border-right: 1.8px solid currentColor;
  border-bottom: 1.8px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
  transition: transform var(--dur) var(--ease);
}
.details[open] > summary::after { transform: rotate(225deg) translateY(-2px); }
.details > .grid { padding: 4px 14px 14px; }

/* 提示气泡 -------------------------------------------------------------- */
.tip {
  display: inline-grid;
  place-items: center;
  width: 15px;
  height: 15px;
  margin-left: 4px;
  border-radius: 50%;
  background: var(--surface-3);
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 700;
  vertical-align: 1px;
  cursor: help;
  user-select: none;
}
</style>
<style data-source="css/finance.css">
/* ==========================================================================
   finance.css — 房贷 / 税后收入：结果区、指标、图表、表格、提示
   ========================================================================== */

.result { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.result:empty { display: none; }

/* 主结果卡 -------------------------------------------------------------- */
.hero {
  position: relative;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2) 46%, transparent);
}

.hero__label {
  display: block;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 560;
}

.hero__value {
  display: block;
  margin-top: 4px;
  font-family: var(--font-num);
  font-size: 36px;
  font-weight: 560;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--text);
}
.hero__value .unit {
  margin-left: 3px;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-3);
}
.hero__value--accent { color: var(--accent); }
.hero__value--green { color: var(--green); }

.hero__sub {
  display: block;
  margin-top: 6px;
  color: var(--text-2);
  font-size: 12.5px;
  line-height: 1.55;
}

.hero--split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

/* 指标网格 -------------------------------------------------------------- */
.metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--line);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.metric {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 13px 14px;
  background: var(--surface);
  min-width: 0;
}

.metric__label {
  display: flex;
  align-items: center;
  gap: 2px;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 540;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.metric__value {
  font-family: var(--font-num);
  font-size: 19px;
  font-weight: 580;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.metric__value small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
.metric__value.is-accent { color: var(--accent); }
.metric__value.is-green { color: var(--green); }
.metric__value.is-cyan { color: var(--cyan); }
.metric__value.is-red { color: var(--red); }

.metrics--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metrics--1 { grid-template-columns: 1fr; }

/* 图表 ------------------------------------------------------------------ */
.chart-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.chart-block__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.chart-block__title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-2);
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 146px;
  padding: 4px 0 0;
}
.chart-wrap--sm { height: 54px; }

.chart { display: block; width: 100%; height: 100%; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-top: 8px;
}
.legend__item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 540;
}
.legend__dot {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  background: var(--c, var(--accent));
}
.legend__dot--line {
  width: 3px;
  height: 11px;
  border-radius: 2px;
}

/* 本金 / 利息堆叠条 ----------------------------------------------------- */
.stackbar {
  display: flex;
  height: 12px;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--surface-3);
}
.stackbar__seg { height: 100%; transition: width 320ms var(--ease); }
.stackbar__seg--p { background: var(--accent); }
.stackbar__seg--i { background: var(--cyan); }
.stackbar__seg--f { background: var(--violet); }

/* 表格 ------------------------------------------------------------------ */
.tablewrap {
  min-width: 0;          /* 允许 flex 子项收缩，避免内容把手风琴撑开 */
  position: relative;
  max-width: 100%;
  max-height: 420px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.tablewrap--tall { max-height: 560px; }
.tablewrap--scroll::after {
  content: "← 左右滑动查看完整列 →";
  position: sticky;
  left: 0;
  bottom: 0;
  display: block;
  padding: 5px 10px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
  color: var(--text-3);
  font-size: 11px;
  text-align: center;
}

table.data {
  width: 100%;
  table-layout: fixed;     /* 按列宽均分，避免内容把表格撑宽 */
  border-collapse: separate;
  border-spacing: 0;
  font-variant-numeric: tabular-nums;
}

table.data th,
table.data td {
  padding: 9px 4px;
  font-size: 10px;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-bottom: 1px solid var(--line);
}
table.data th { font-size: 10px; color: var(--text-3); }

/* 宽屏下用稍大的字号与内距 */
@media (min-width: 460px) {
  table.data th,
  table.data td { padding: 9px 6px; font-size: 11.5px; }
}

/* 还款计划表：期 / 时间 / 本金 / 利息 / 剩余本金
   最小宽度按「10px 字号 + 7 位金额」实测标定，窄屏下刚好铺满卡片；
   若视口更窄则交由 .tablewrap--scroll 横向滚动 */
table.data--schedule { min-width: 288px; }
table.data--schedule th:nth-child(1), table.data--schedule td:nth-child(1) { width: 31px; }
table.data--schedule th:nth-child(2), table.data--schedule td:nth-child(2) { width: 50px; }
table.data--schedule th:nth-child(3), table.data--schedule td:nth-child(3) { width: 61px; }
table.data--schedule th:nth-child(4), table.data--schedule td:nth-child(4) { width: 58px; }
table.data--schedule th:nth-child(5), table.data--schedule td:nth-child(5) { width: 64px; }

/* 个税逐月明细：月份 / 累计应税所得 / 税率 / 当月个税 / 当月到手 */
table.data--tax { min-width: 288px; }
table.data--tax th:nth-child(1), table.data--tax td:nth-child(1) { width: 37px; }
table.data--tax th:nth-child(2), table.data--tax td:nth-child(2) { width: 76px; }
table.data--tax th:nth-child(3), table.data--tax td:nth-child(3) { width: 32px; }
table.data--tax th:nth-child(4), table.data--tax td:nth-child(4) { width: 66px; }
table.data--tax th:nth-child(5), table.data--tax td:nth-child(5) { width: 77px; }

table.data th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  color: var(--text-2);
  font-weight: 600;
  font-size: 11.5px;
}
table.data th:first-child,
table.data td:first-child { text-align: left; }

table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
table.data tbody tr.is-prepay td {
  background: var(--amber-weak);
  color: var(--text);
  font-weight: 560;
}
table.data tbody tr.is-grade td {
  background: var(--surface-3);
  font-weight: 620;
  color: var(--text);
}

/* 徽标 / 标签 ----------------------------------------------------------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 620;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.tag--accent { background: var(--accent-weak); color: var(--accent); }
.tag--green { background: var(--green-weak); color: var(--green); }
.tag--cyan { background: var(--cyan-weak); color: var(--cyan); }
.tag--violet { background: var(--violet-weak); color: var(--violet); }
.tag--amber { background: var(--amber-weak); color: var(--amber); }
.tag--plain { background: var(--surface-3); color: var(--text-2); }

/* 方案对比 -------------------------------------------------------------- */
.plan {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.plan--best { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); background: var(--green-weak); }

.plan__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.plan__name { font-size: 13.5px; font-weight: 640; }
.plan__body {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.plan__cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan__cell b {
  font-family: var(--font-num);
  font-size: 15px;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
}
.plan__cell span { color: var(--text-3); font-size: 11px; }

/* 明细列表 -------------------------------------------------------------- */
.rows { display: flex; flex-direction: column; }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
.row:last-child { border-bottom: 0; }
.row__label { color: var(--text-2); display: flex; align-items: center; min-width: 0; }
.row__value {
  font-family: var(--font-num);
  font-weight: 580;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.row__value.is-minus { color: var(--red); }
.row__value.is-plus { color: var(--green); }
.row--total { border-top: 1px solid var(--line-strong); margin-top: 2px; padding-top: 12px; }
.row--total .row__label { color: var(--text); font-weight: 620; }
.row--total .row__value { font-size: 16px; }

/* 提示条 ---------------------------------------------------------------- */
.note {
  display: flex;
  gap: 8px;
  padding: 11px 13px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 12px;
  line-height: 1.6;
}
.note--warn { background: var(--amber-weak); border-color: transparent; color: var(--text); }
.note--danger { background: var(--red-weak); border-color: transparent; color: var(--text); }
.note b { color: var(--text); }

/* 悬浮提示 -------------------------------------------------------------- */
.tip { position: relative; }
.tip::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translate(-50%, 4px);
  width: max-content;
  max-width: 232px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--overlay);
  color: var(--text);
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.55;
  white-space: normal;
  text-align: left;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 20;
}
.tip:hover::after,
.tip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="shell">
  <header class="appbar">
    <div class="appbar__brand">
      <span class="appbar__logo" aria-hidden="true"></span>
      <span class="appbar__title">房贷 · 税后收入</span>
    </div>
    <div class="appbar__actions">
      <button class="icon-btn icon-btn--text" id="resetBtn" type="button" aria-label="恢复全部默认参数" title="恢复默认参数">恢复默认</button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="切换浅色 / 深色模式" title="切换主题">
        <span class="icon-btn__sun" aria-hidden="true"></span>
        <span class="icon-btn__moon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="计算模式">
    <button class="tabbar__btn is-active" role="tab" aria-selected="true" data-tab="loan" id="tabBtnLoan">房贷计算</button>
    <button class="tabbar__btn" role="tab" aria-selected="false" data-tab="tax" id="tabBtnTax">税后收入</button>
    <span class="tabbar__slider" aria-hidden="true"></span>
  </nav>

  <p class="loaded-note" id="loadedNote" hidden></p>

  <main class="content">

    <!-- ══════════════ 房贷计算 ══════════════ -->
    <section class="pane is-active" id="pane-loan" role="tabpanel" aria-labelledby="tabBtnLoan">
      <form class="stack" id="loanForm" autocomplete="off">
        <div class="card">
          <div class="card__head">
            <h2 class="card__title">贷款信息</h2>
            <span class="muted" id="loanRateHint"></span>
          </div>

          <div class="field">
            <span class="field__label">还款方式</span>
            <div class="seg" data-name="method">
              <button class="seg__btn is-active" type="button" data-value="equal-pi">等额本息</button>
              <button class="seg__btn" type="button" data-value="equal-pr">等额本金</button>
            </div>
          </div>

          <div class="field">
            <span class="field__label">贷款类型</span>
            <div class="seg" data-name="type">
              <button class="seg__btn is-active" type="button" data-value="commercial">商业贷款</button>
              <button class="seg__btn" type="button" data-value="fund">公积金</button>
              <button class="seg__btn" type="button" data-value="mix">组合贷</button>
            </div>
          </div>

          <div class="grid grid--2">
            <label class="field">
              <span class="field__label" id="loanAmountLabel">贷款金额</span>
              <span class="input">
                <input class="input__el" id="loanAmount" type="text" inputmode="decimal" data-format="money" value="1,000,000">
                <span class="input__suffix">元</span>
              </span>
            </label>
            <label class="field">
              <span class="field__label">贷款年限</span>
              <span class="input">
                <input class="input__el" id="loanTerm" type="text" inputmode="numeric" data-format="int" value="30">
                <span class="input__suffix">年</span>
              </span>
            </label>
          </div>

          <div class="grid grid--2" id="fundRow" hidden>
            <label class="field">
              <span class="field__label">公积金贷款金额</span>
              <span class="input">
                <input class="input__el" id="loanFundAmount" type="text" inputmode="decimal" data-format="money" value="600,000">
                <span class="input__suffix">元</span>
              </span>
            </label>
            <label class="field">
              <span class="field__label">公积金年利率</span>
              <span class="input">
                <input class="input__el" id="loanFundRate" type="text" inputmode="decimal" data-format="rate" value="2.6">
                <span class="input__suffix">%</span>
              </span>
            </label>
          </div>

          <label class="field">
            <span class="field__label" id="loanRateLabel">商业贷款年利率</span>
            <span class="input">
              <input class="input__el" id="loanRate" type="text" inputmode="decimal" data-format="rate" value="3.1">
              <span class="input__suffix">%</span>
            </span>
            <span class="field__foot">
              <span class="chips">
                <button class="chip" type="button" data-rate="3.05">3.05%</button>
                <button class="chip" type="button" data-rate="3.10">3.10%</button>
                <button class="chip" type="button" data-rate="3.30">3.30%</button>
              </span>
              <span class="muted">以放款银行实际执行为准</span>
            </span>
          </label>

          <div class="field">
            <span class="field__label">贷款年限快选</span>
            <span class="chips">
              <button class="chip" type="button" data-term="10">10年</button>
              <button class="chip" type="button" data-term="15">15年</button>
              <button class="chip" type="button" data-term="20">20年</button>
              <button class="chip" type="button" data-term="25">25年</button>
              <button class="chip" type="button" data-term="30">30年</button>
            </span>
          </div>

          <button class="btn btn--primary" id="loanCalcBtn" type="submit">开始计算</button>
        </div>

        <div class="card">
          <div class="card__head">
            <h2 class="card__title">还款计划表</h2>
            <div class="seg seg--sm" data-name="sched">
              <button class="seg__btn" type="button" data-value="year">按年</button>
              <button class="seg__btn is-active" type="button" data-value="month">按月</button>
            </div>
          </div>
          <label class="field">
            <span class="field__label">首期还款月份</span>
            <input class="input__el" id="loanStart" type="month" value="2026-01">
          </label>
          <p class="muted">按月视图可查看每一期的本金、利息与剩余本金。</p>
        </div>

        <div class="card">
          <div class="card__head"><h2 class="card__title">提前还款测算</h2></div>
          <label class="switch">
            <input type="checkbox" id="ppOn">
            <span class="switch__track" aria-hidden="true"></span>
            <span class="switch__text">测算提前还款</span>
          </label>

          <div id="ppFields" hidden>
            <div class="grid grid--2">
              <label class="field">
                <span class="field__label">第几期提前还款</span>
                <span class="input">
                  <input class="input__el" id="ppMonth" type="text" inputmode="numeric" data-format="int" value="60">
                  <span class="input__suffix">期</span>
                </span>
              </label>
              <label class="field">
                <span class="field__label">提前还款金额</span>
                <span class="input">
                  <input class="input__el" id="ppAmount" type="text" inputmode="decimal" data-format="money" value="200,000">
                  <span class="input__suffix">元</span>
                </span>
              </label>
            </div>
            <div class="field">
              <span class="field__label">处理方式</span>
              <div class="seg" data-name="ppMode">
                <button class="seg__btn is-active" type="button" data-value="reduce-payment">月供不变・缩短期限</button>
                <button class="seg__btn" type="button" data-value="reduce-term">期限不变・减少月供</button>
              </div>
            </div>
          </div>
        </div>
      </form>

      <div class="result" id="loanResult" aria-live="polite"></div>
    </section>

    <!-- ══════════════ 税后收入 ══════════════ -->
    <section class="pane" id="pane-tax" role="tabpanel" aria-labelledby="tabBtnTax" hidden>
      <form class="stack" id="taxForm" autocomplete="off">
        <div class="card">
          <div class="card__head">
            <h2 class="card__title">收入与城市</h2>
          </div>
          <div class="grid grid--2">
            <label class="field">
              <span class="field__label">所在城市</span>
              <select class="select" id="taxCity"></select>
            </label>
            <label class="field">
              <span class="field__label">税前月薪</span>
              <span class="input">
                <input class="input__el" id="taxSalary" type="text" inputmode="decimal" data-format="money" value="30,000">
                <span class="input__suffix">元</span>
              </span>
            </label>
          </div>
          <div class="grid grid--2">
            <label class="field">
              <span class="field__label">年终奖（可选）</span>
              <span class="input">
                <input class="input__el" id="taxBonus" type="text" inputmode="decimal" data-format="money" value="0">
                <span class="input__suffix">元</span>
              </span>
            </label>
            <label class="field">
              <span class="field__label">专项附加扣除／月</span>
              <span class="input">
                <input class="input__el" id="taxSpecial" type="text" inputmode="decimal" data-format="money" value="0">
                <span class="input__suffix">元</span>
              </span>
              <span class="field__foot">
                <span class="muted">子女教育 2000 · 房贷 1000 · 赡养老人 3000 · 3岁以下照护 2000</span>
              </span>
            </label>
          </div>
        </div>

        <div class="card">
          <div class="card__head">
            <h2 class="card__title">五险一金</h2>
            <span class="muted" id="taxBaseHint"></span>
          </div>
          <label class="field">
            <span class="field__label">缴费基数</span>
            <div class="seg" data-name="baseMode">
              <button class="seg__btn is-active" type="button" data-value="salary">按实际工资</button>
              <button class="seg__btn" type="button" data-value="custom">自定义基数</button>
            </div>
          </label>
          <label class="field" id="taxBaseWrap" hidden>
            <span class="field__label">自定义缴费基数</span>
            <span class="input">
              <input class="input__el" id="taxBase" type="text" inputmode="decimal" data-format="money" value="30,000">
              <span class="input__suffix">元</span>
            </span>
          </label>

          <details class="details">
            <summary>缴费比例与基数上下限（可修改）</summary>
            <div class="grid grid--2">
              <label class="field">
                <span class="field__label">养老保险</span>
                <span class="input"><input class="input__el" id="taxRatePension" type="text" inputmode="decimal" data-format="rate" value="8"><span class="input__suffix">%</span></span>
              </label>
              <label class="field">
                <span class="field__label">医疗保险</span>
                <span class="input"><input class="input__el" id="taxRateMedical" type="text" inputmode="decimal" data-format="rate" value="2"><span class="input__suffix">%</span></span>
              </label>
              <label class="field">
                <span class="field__label">失业保险</span>
                <span class="input"><input class="input__el" id="taxRateUnemploy" type="text" inputmode="decimal" data-format="rate" value="0.5"><span class="input__suffix">%</span></span>
              </label>
              <label class="field">
                <span class="field__label">住房公积金</span>
                <span class="input"><input class="input__el" id="taxRateFund" type="text" inputmode="decimal" data-format="rate" value="12"><span class="input__suffix">%</span></span>
              </label>
              <label class="field">
                <span class="field__label">大额医疗互助</span>
                <span class="input"><input class="input__el" id="taxMedicalFix" type="text" inputmode="decimal" data-format="money" value="3"><span class="input__suffix">元/月</span></span>
              </label>
              <label class="field">
                <span class="field__label">个税起征点</span>
                <span class="input"><input class="input__el" id="taxThreshold" type="text" inputmode="decimal" data-format="money" value="5,000"><span class="input__suffix">元/月</span></span>
              </label>
              <label class="field">
                <span class="field__label">社保基数下限</span>
                <span class="input"><input class="input__el" id="taxBaseMin" type="text" inputmode="decimal" data-format="money"><span class="input__suffix">元</span></span>
              </label>
              <label class="field">
                <span class="field__label">社保基数上限</span>
                <span class="input"><input class="input__el" id="taxBaseMax" type="text" inputmode="decimal" data-format="money"><span class="input__suffix">元</span></span>
              </label>

          <button class="btn btn--primary" id="taxCalcBtn" type="submit">开始计算</button>
        </div>

      <div class="result" id="taxResult" aria-live="polite"></div>
    </section>

  </main>

  <footer class="footnote">
    <p>计算结果依据公开税率与常见缴费比例，仅供参考，不构成税务或信贷建议。</p>
    <p>社保基数与公积金比例以当地社保局、公积金管理中心及放款银行最新公告为准。</p>
  </footer>
