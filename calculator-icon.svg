<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F3F7"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- 白色直角底 -->
  <rect x="0" y="0" width="180" height="180" fill="url(#bg)"/>

  <!-- 加号 -->
  <rect x="48" y="49" width="26" height="6" rx="3" fill="#3A3A3C"/>
  <rect x="58" y="39" width="6" height="26" rx="3" fill="#3A3A3C"/>

  <!-- 减号 -->
  <rect x="106" y="49" width="26" height="6" rx="3" fill="#3A3A3C"/>

  <!-- 乘号 -->
  <g stroke="#3A3A3C" stroke-width="6" stroke-linecap="round">
    <line x1="50" y1="99" x2="72" y2="121"/>
    <line x1="72" y1="99" x2="50" y2="121"/>
  </g>

  <!-- 等号橙色按钮 -->
  <rect x="98" y="96" width="44" height="44" rx="14" fill="url(#eq)"/>
  <rect x="108" y="109" width="24" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="108" y="121" width="24" height="6" rx="3" fill="#FFFFFF"/>
</svg>
